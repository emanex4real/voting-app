<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register — Lemon Vote</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FFFBEF; --card: #FFFFFF; --ink: #2E3B1F; --ink-soft: #78825F;
      --lemon: #A4C639; --lemon-dark: #87A62E; --leaf: #87A62E; --leaf-dim: #EEF5D9; --line: #EDE6C8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      background: var(--cream);
      color: var(--ink);
      font-family: 'Work Sans', sans-serif;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .panel { width: 100%; max-width: 380px; }
    .mark-row { display: flex; flex-direction: column; align-items: center; margin-bottom: 26px; }
    h1 {
      font-family: 'Fredoka', sans-serif; font-weight: 600;
      font-size: 26px; margin: 14px 0 0; text-align: center;
    }
    .flash {
      background: var(--leaf-dim); border-left: 4px solid var(--leaf); border-radius: 10px;
      padding: 10px 14px; margin-bottom: 18px; font-size: 14px;
    }
    form { display: flex; flex-direction: column; gap: 12px; }
    input {
      padding: 13px 16px; font-size: 15px; font-family: inherit;
      border: 2px solid var(--line); border-radius: 12px;
      background: var(--card); color: var(--ink);
    }
    input:focus { outline: none; border-color: var(--leaf); }
    button {
      background: var(--lemon); color: var(--ink); border: none; border-radius: 12px;
      padding: 14px; font-family: 'Fredoka', sans-serif; font-size: 16px; font-weight: 600;
      cursor: pointer; margin-top: 4px;
    }
    button:hover { background: var(--lemon-dark); }
    .alt { text-align: center; margin-top: 18px; font-size: 14px; color: var(--ink-soft); }
    .alt a { color: var(--leaf); font-weight: 500; text-decoration: none; }
  </style>
</head>
<body>
  <div class="panel">
    <div class="mark-row">
      <svg width="48" height="48" viewBox="0 0 36 36" aria-hidden="true">
        <circle cx="18" cy="18" r="16.5" fill="#A4C639" stroke="#87A62E" stroke-width="2.5"/>
        <circle cx="18" cy="18" r="5" fill="#FFFBEF"/>
        <g stroke="#FFFBEF" stroke-width="1.6">
          <line x1="18" y1="18" x2="18" y2="4"/>
          <line x1="18" y1="18" x2="30" y2="11"/>
          <line x1="18" y1="18" x2="30" y2="25"/>
          <line x1="18" y1="18" x2="18" y2="32"/>
          <line x1="18" y1="18" x2="6" y2="25"/>
          <line x1="18" y1="18" x2="6" y2="11"/>
        </g>
      </svg>
      <h1>Register to vote</h1>
    </div>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
      {% endif %}
    {% endwith %}
    <form method="post">
      <input type="text" name="username" placeholder="Username" required autofocus>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Register</button>
    </form>
    <p class="alt">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
  </div>
</body>
</html>
