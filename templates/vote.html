{% extends "base.html" %}
{% block content %}
  <h1 class="page-title">Cast your vote</h1>

  <div class="card">
    {% if user.has_voted %}
      <p style="margin:0; color: var(--ink-soft);">Your vote has been recorded. Thanks for taking part!</p>
    {% else %}
      <form method="post">
        {% for option in options %}
          <label class="option-row">
            <input type="radio" name="option_id" value="{{ option.id }}" required>
            <span class="bubble">{{ option.name }}</span>
          </label>
        {% endfor %}
        <button type="submit" class="cast">Cast my vote</button>
      </form>
    {% endif %}
  </div>
{% endblock %}
