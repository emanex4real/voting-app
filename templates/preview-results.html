<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voting App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FFFBEF;
      --card: #FFFFFF;
      --ink: #2E3B1F;
      --ink-soft: #78825F;
      --lemon: #A4C639;
      --lemon-dark: #87A62E;
      --leaf: #87A62E;
      --leaf-dim: #EEF5D9;
      --line: #EDE6C8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--cream);
      color: var(--ink);
      font-family: 'Work Sans', sans-serif;
      font-size: 16px;
      line-height: 1.55;
    }
    .wrap { max-width: 560px; margin: 0 auto; padding: 0 24px 64px; }

    header.top {
      padding: 28px 0 18px;
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--ink); }
    .brand-name {
      font-family: 'Fredoka', sans-serif;
      font-weight: 600;
      font-size: 21px;
    }
    nav.top-nav { display: flex; gap: 18px; }
    nav.top-nav a {
      color: var(--ink-soft);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 20px;
    }
    nav.top-nav a:hover { background: var(--leaf-dim); color: var(--ink); }

    .flash {
      background: var(--leaf-dim);
      border-left: 4px solid var(--leaf);
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 22px;
      font-size: 14.5px;
      color: var(--ink);
    }

    h1.page-title {
      font-family: 'Fredoka', sans-serif;
      font-weight: 600;
      font-size: 30px;
      margin: 0 0 24px;
      color: var(--ink);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 26px;
      box-shadow: 0 2px 0 var(--line);
    }

    .option-row {
      display: block;
      border: 2px solid var(--line);
      border-radius: 14px;
      padding: 15px 18px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .option-row:hover { border-color: var(--leaf); }
    .option-row input { display: none; }
    .bubble { display: inline-flex; align-items: center; gap: 14px; font-size: 16px; font-weight: 500; }
    .bubble::before {
      content: "";
      width: 20px; height: 20px;
      border: 2px solid var(--ink-soft);
      border-radius: 50%;
      flex-shrink: 0;
      transition: background 0.1s ease, border-color 0.1s ease;
    }
    .option-row input:checked ~ .bubble::before {
      background: var(--leaf);
      border-color: var(--leaf);
      box-shadow: inset 0 0 0 3px var(--card);
    }
    .option-row:has(input:checked) {
      border-color: var(--leaf);
      background: var(--leaf-dim);
    }

    button.cast {
      width: 100%;
      background: var(--lemon);
      color: var(--ink);
      border: none;
      border-radius: 14px;
      padding: 15px;
      font-family: 'Fredoka', sans-serif;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 16px;
    }
    button.cast:hover { background: var(--lemon-dark); }

    footer.bottom {
      text-align: center;
      color: var(--ink-soft);
      font-size: 13px;
      margin-top: 44px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <a href="#" class="brand">
        <svg width="34" height="34" viewBox="0 0 36 36" aria-hidden="true">
          <circle cx="18" cy="18" r="16.5" fill="#A4C639" stroke="#87A62E" stroke-width="2.5"/>
          <circle cx="18" cy="18" r="5" fill="#FFFBEF"/>
          <g stroke="#FFFBEF" stroke-width="1.6">
            <line x1="18" y1="18" x2="18" y2="4"/>
            <line x1="18" y1="18" x2="30" y2="11"/>
            <line x1="18" y1="18" x2="30" y2="25"/>
            <line x1="18" y1="18" x2="18" y2="32"/>
            <line x1="18" y1="18" x2="6" y2="25"/>
            <line x1="18" y1="18" x2="6" y2="11"/>
          </g>
        </svg>
        <span class="brand-name">Lemon Vote</span>
      </a>
      <nav class="top-nav">
        <a href="#">Vote</a>
        <a href="#">Results</a>
        <a href="#">Log out</a>
      </nav>
    </header>

    
      
    

    
  <h1 class="page-title">Live results</h1>

  <div class="card">
    <p style="margin: 0 0 22px; color: var(--ink-soft); font-size: 14.5px;">
      142 votes counted so far
    </p>

    
      
      <div style="margin-bottom: 20px;">
        <div style="display:flex; justify-content:space-between; margin-bottom: 7px; font-size: 15px; font-weight: 500;">
          <span>Amina Yusuf</span>
          <span style="color: var(--ink-soft); font-weight: 400;">68 &middot; 48%</span>
        </div>
        <div style="background: var(--leaf-dim); height: 12px; border-radius: 8px; overflow: hidden;">
          <div style="background: var(--lemon); height: 100%; width: 47.88732394366197%; border-radius: 8px;"></div>
        </div>
      </div>
    
      
      <div style="margin-bottom: 20px;">
        <div style="display:flex; justify-content:space-between; margin-bottom: 7px; font-size: 15px; font-weight: 500;">
          <span>Chidi Okafor</span>
          <span style="color: var(--ink-soft); font-weight: 400;">51 &middot; 36%</span>
        </div>
        <div style="background: var(--leaf-dim); height: 12px; border-radius: 8px; overflow: hidden;">
          <div style="background: var(--lemon); height: 100%; width: 35.91549295774648%; border-radius: 8px;"></div>
        </div>
      </div>
    
      
      <div style="margin-bottom: 20px;">
        <div style="display:flex; justify-content:space-between; margin-bottom: 7px; font-size: 15px; font-weight: 500;">
          <span>Grace Adeyemi</span>
          <span style="color: var(--ink-soft); font-weight: 400;">23 &middot; 16%</span>
        </div>
        <div style="background: var(--leaf-dim); height: 12px; border-radius: 8px; overflow: hidden;">
          <div style="background: var(--lemon); height: 100%; width: 16.19718309859155%; border-radius: 8px;"></div>
        </div>
      </div>
    
  </div>


    <footer class="bottom">Fresh picked results, updated as votes come in.</footer>
  </div>
</body>
</html>
