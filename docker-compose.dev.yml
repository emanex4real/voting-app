# Phase 2: run ONLY Redis and Postgres in Docker.
# Flask and the Node worker still run directly on your machine and connect
# to these over localhost. In Phase 3 we'll containerize Flask/Worker too
# and switch to a single docker-compose.yml for the whole stack.

version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: voting
      POSTGRES_PASSWORD: voting
      POSTGRES_DB: voting
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voting"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
